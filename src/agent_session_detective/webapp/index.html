<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent session detective</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">agent&nbsp;session&nbsp;detective</div>
  <div class="statusline" id="status-line">initializing</div>
</header>

<div class="layout">
  <!-- left: sessions, always visible -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <h1>sessions</h1>
      <div>
        <button class="btn small" id="upload-btn" type="button" title="上传一份 jsonl 会话文件（如别人机器导出的 transcript），落盘后与扫描会话同等分析">upload</button>
        <button class="btn small" id="fleet-btn" type="button" title="跨会话聚合，需要解析全部日志，约 10 秒">fleet</button>
        <button class="btn small" id="refresh" type="button">rescan</button>
      </div>
    </div>
    <input class="session-search" id="session-search" type="search" autocomplete="off"
           placeholder="search all sessions by id / workspace…">
    <input type="file" id="upload-input" accept=".jsonl" hidden>
    <div class="fleet" id="fleet" hidden></div>
    <div class="session-list" id="session-list"></div>
  </aside>

  <!-- right: audit + report -->
  <main class="main">
    <div class="main-head">
      <h1 id="audit-title">pick a session</h1>
      <a class="btn small" id="tree-link" href="#" target="_blank" rel="noopener" hidden
         title="该会话实际执行的 skill 调用树（从 IR 文档渲染的独立页面）">skill tree</a>
      <button class="btn small" id="catalog-audit-btn" type="button"
         title="离线体检 skill catalog 本身：体量分级 / description 质量 / 分层有效性 / 解析健康度 / 近重复 / 加载闭包。不需要会话日志、不调用 LLM，结论与行为审计相互独立">catalog audit</button>
    </div>

    <form class="audit-form" id="audit-form" hidden>
      <div class="chips">
        <span class="dim">templates:</span>
        <button class="chip" type="button" data-template="bugfix">bugfix 测试</button>
        <button class="chip" type="button" data-template="feature">feature 测试</button>
        <button class="chip ghost" type="button" data-template="clear">清空</button>
      </div>
      <div class="form-row">
        <label class="wide"><span class="label-row">skill 目录 <span class="help-wrap"><button class="help-dot" type="button" data-help="dirs">?</button><div class="help-pop"></div></span></span> <span class="dim">每行一个，可留空</span>
          <textarea name="dirs" rows="2" placeholder="~/.agents/skills&#10;~/.workbuddy/plugins/cache"></textarea>
          <span class="dir-status dim" id="dir-status"></span>
        </label>
        <label class="wide"><span class="label-row">skill 原文注入 <span class="help-wrap"><button class="help-dot" type="button" data-help="inject">?</button><div class="help-pop"></div></span></span> <span class="dim">JSON，可留空</span>
          <textarea name="inject" rows="3" spellcheck="false" placeholder='{"cloud-service": {"description": "Sites need a backend? Load this first.", "intent": "接入托管后端"}}'></textarea>
          <span class="dir-status dim" id="inject-status"></span>
        </label>
      </div>
      <div class="form-row">
        <label><span class="label-row">expect skills <span class="help-wrap"><button class="help-dot" type="button" data-help="expect">?</button><div class="help-pop"></div></span></span> <span class="dim">comma separated</span>
          <input name="expect" placeholder="Poteto Mode, how, why">
        </label>
        <label><span class="label-row">playbook <span class="help-wrap"><button class="help-dot" type="button" data-help="playbook">?</button><div class="help-pop"></div></span></span> <span class="dim">instruction following</span>
          <select name="playbook">
            <option value="">none</option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" name="judge"> <span class="label-row">judge missed triggers <span class="help-wrap"><button class="help-dot" type="button" data-help="judge">?</button><div class="help-pop"></div></span></span>
          <span class="dim">(~10 min)</span>
        </label>
        <label class="check">
          <input type="checkbox" name="billed"> <span class="label-row">billed usage <span class="help-wrap"><button class="help-dot" type="button" data-help="billed">?</button><div class="help-pop"></div></span></span>
          <span class="dim">SharedClientCache</span>
        </label>
        <button class="btn primary" type="submit">run audit</button>
      </div>
    </form>

    <div class="progress" id="progress" hidden>
      <div class="steps" id="steps"></div>
    </div>

    <section class="catalog-audit" id="catalog-audit" hidden>
      <div class="catalog-head">
        <h2>catalog 静态体检</h2>
        <span class="dim">离线 · 零 LLM · 不需要会话日志 · 与上方行为审计相互独立</span>
        <button class="btn small ghost" id="catalog-audit-close" type="button">收起</button>
      </div>
      <div class="catalog-body" id="catalog-audit-body">
        <p class="dim">点右上角「catalog audit」开始体检。</p>
      </div>
    </section>

    <div id="report"></div>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
